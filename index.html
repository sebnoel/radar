<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Flight Display</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:#000; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; }
  #led { display:block; background:#05060a; image-rendering:pixelated; }

  body.idle, body.idle * { cursor:none !important; }
  #gear { position:fixed; top:max(8px, env(safe-area-inset-top)); right:10px; z-index:5; background:none; border:0; color:#fff; opacity:.18; font-size:26px; padding:8px; cursor:pointer; }
  #gear:hover,#gear:focus { opacity:.8; }

  #radar { position:fixed; inset:0; width:100%; height:100%; display:none; z-index:3; background:#010805; cursor:pointer; }
  #dock { position:fixed; left:50%; transform:translateX(-50%); bottom:max(10px, env(safe-area-inset-bottom)); z-index:5; display:none; gap:10px; }
  #dock button { font:13px system-ui,sans-serif; color:#cfd6e6; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:6px 16px; opacity:.3; cursor:pointer; letter-spacing:.02em; }
  #dock button.on { opacity:.75; border-color:rgba(255,255,255,.45); }
  #dock button:hover, #dock button:focus-visible { opacity:1; }

  #settings { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.92); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; font-family:system-ui,sans-serif; overflow:auto; }
  #settings.open { display:flex; }
  #card { background:#12151c; color:#e8ecf5; padding:24px; border-radius:14px; width:min(92vw,400px); max-height:94vh; overflow-y:auto; overflow-x:hidden; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; margin:auto; }
  #card h2 { font-size:18px; font-weight:600; }
  #card label { display:grid; grid-template-columns:minmax(0,1fr); gap:6px; font-size:14px; color:#a9b2c7; min-width:0; }
  #card input, #card select { width:100%; min-width:0; background:#0a0c11; border:1px solid #2a3040; color:#fff; border-radius:8px; padding:10px; font-size:16px; }
  #card .row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; min-width:0; }
  #card button { border:0; border-radius:8px; padding:11px; font-size:15px; cursor:pointer; background:#2a3040; color:#fff; }
  #card button.p { background:#1c4fd6; }
  #status { font-size:12px; color:#7d879c; min-height:1.2em; }
</style>
</head>
<body>

<canvas id="led"></canvas>
<canvas id="radar"></canvas>
<div id="dock">
  <button id="bNormal" type="button">Normal</button>
  <button id="bFollow" type="button"></button>
</div>
<button id="gear" aria-label="Paramètres">⚙</button>

<div id="settings">
  <div id="card">
    <h2>Paramètres</h2>
    <label>Rayon d’interception (km)
      <input id="radius" type="number" min="1" max="200" step="1">
    </label>
    <label>Rafraîchissement (secondes)
      <input id="refresh" type="number" min="2" max="300" step="1">
    </label>
    <div class="row">
      <label>Latitude <input id="lat" type="number" step="0.0001"></label>
      <label>Longitude <input id="lon" type="number" step="0.0001"></label>
    </div>
    <label>Relais (optionnel, URL du Worker)
      <input id="proxy" type="url" placeholder="https://radar-relay.sebnoel.workers.dev">
    </label>
    <label>Info 1 sous l’indicatif (vue radar)
      <select id="radarInfo1">
        <option value="alt">Altitude</option>
        <option value="route">Origine → destination</option>
        <option value="speed">Vitesse sol (kt)</option>
        <option value="type">Type d’avion</option>
        <option value="dist">Distance jusqu’à moi</option>
        <option value="track">Cap (°)</option>
        <option value="vrate">Montée / descente</option>
        <option value="none">Aucune</option>
      </select>
    </label>
    <label>Info 2 (en dessous)
      <select id="radarInfo2">
        <option value="alt">Altitude</option>
        <option value="route">Origine → destination</option>
        <option value="speed">Vitesse sol (kt)</option>
        <option value="type">Type d’avion</option>
        <option value="dist">Distance jusqu’à moi</option>
        <option value="track">Cap (°)</option>
        <option value="vrate">Montée / descente</option>
        <option value="none">Aucune</option>
      </select>
    </label>
    <label>Position des échelles de distance (radar)
      <select id="scaleDir">
        <option value="0">Nord</option>
        <option value="45">Nord-Est</option>
        <option value="90">Est</option>
        <option value="135">Sud-Est</option>
        <option value="180">Sud</option>
        <option value="225">Sud-Ouest</option>
        <option value="270">Ouest</option>
        <option value="315">Nord-Ouest</option>
      </select>
    </label>
    <label>Vol à suivre (indicatif, ex. AFR37LF)
      <input id="follow" type="text" placeholder="vide = aucun" autocapitalize="characters" autocomplete="off" spellcheck="false">
    </label>
    <button id="geo" type="button">Utiliser ma position</button>
    <div class="row">
      <button id="close" type="button">Fermer</button>
      <button id="save" type="button" class="p">Enregistrer</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

/* ============ Matrice de LEDs : 128 x 72 points ============ */
const W = 128, H = 72;
const fb = new Uint8Array(W*H*3);               // 1 point = 1 LED (RGB, 0 = éteinte)
const FONT = [0,0,0,0,0,0,0,95,0,0,0,7,0,7,0,20,127,20,127,20,36,42,127,42,18,35,19,8,100,98,54,73,86,32,80,0,8,7,3,0,0,28,34,65,0,0,65,34,28,0,42,28,127,28,42,8,8,62,8,8,0,128,112,48,0,8,8,8,8,8,0,0,96,96,0,32,16,8,4,2,62,81,73,69,62,0,66,127,64,0,114,73,73,73,70,33,65,73,77,51,24,20,18,127,16,39,69,69,69,57,60,74,73,73,49,65,33,17,9,7,54,73,73,73,54,70,73,73,41,30,0,0,20,0,0,0,64,52,0,0,0,8,20,34,65,20,20,20,20,20,0,65,34,20,8,2,1,89,9,6,62,65,93,89,78,124,18,17,18,124,127,73,73,73,54,62,65,65,65,34,127,65,65,65,62,127,73,73,73,65,127,9,9,9,1,62,65,65,81,115,127,8,8,8,127,0,65,127,65,0,32,64,65,63,1,127,8,20,34,65,127,64,64,64,64,127,2,28,2,127,127,4,8,16,127,62,65,65,65,62,127,9,9,9,6,62,65,81,33,94,127,9,25,41,70,38,73,73,73,50,3,1,127,1,3,63,64,64,64,63,31,32,64,32,31,63,64,56,64,63,99,20,8,20,99,3,4,120,4,3,97,89,73,77,67,0,127,65,65,65,2,4,8,16,32,0,65,65,65,127,4,2,1,2,4,64,64,64,64,64,0,3,7,8,0,32,84,84,120,64,127,40,68,68,56,56,68,68,68,40,56,68,68,40,127,56,84,84,84,24,0,8,126,9,2,24,164,164,156,120,127,8,4,4,120,0,68,125,64,0,32,64,64,61,0,127,16,40,68,0,0,65,127,64,0,124,4,120,4,120,124,8,4,4,120,56,68,68,68,56,252,24,36,36,24,24,36,36,24,252,124,8,4,4,8,72,84,84,84,36,4,4,63,68,36,60,64,64,32,124,28,32,64,32,28,60,64,48,64,60,68,40,16,40,68,76,144,144,144,124,68,100,84,76,68,0,8,54,65,0,0,0,119,0,0,0,65,54,8,0,2,1,2,4,2];                         // police 5x8, caractères 32..126

const WHITE=[244,247,255], GREEN=[53,224,107];
const clean = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'?');
function put(x,y,c){ if(x<0||y<0||x>=W||y>=H) return; const i=(y*W+x)*3; fb[i]=c[0]; fb[i+1]=c[1]; fb[i+2]=c[2]; }
function rect(x,y,w,h,c){ for(let j=0;j<h;j++) for(let i=0;i<w;i++) put(x+i,y+j,c); }
function textW(s,sc=1){ return s.length ? (s.length*6-1)*sc : 0; }
function text(s,x,y,c=WHITE,sc=1){
  s = clean(s);
  for (const ch of s){
    const k = ch.charCodeAt(0)-32;
    for (let cx=0;cx<5;cx++){ const col = FONT[k*5+cx];
      for (let ry=0;ry<8;ry++) if (col>>ry & 1) rect(x+cx*sc, y+ry*sc, sc, sc, c);
    }
    x += 6*sc;
  }
}
const textR = (s,xr,y,c) => text(s, xr-textW(clean(s)), y, c);
const fit = (s,n) => { s = clean(s); return s.length>n ? s.slice(0,n) : s; };

const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
function hsl(h,s,l){ s/=100; l/=100; const k=n=>(n+h/30)%12, a=s*Math.min(l,1-l), f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return [f(0),f(8),f(4)].map(v=>Math.round(v*255)); }

/* Logos : pastille aux couleurs de la compagnie (ICAO -> [fond, code IATA, texte]) */
const BRAND = { UAL:['#0033a0','UA'], AAL:['#0078d2','AA'], DAL:['#c01933','DL'], SWA:['#304cb2','WN'], JBU:['#003876','B6'], ACA:['#f01428','AC'],
  AFR:['#002157','AF'], BAW:['#075aaa','BA'], DLH:['#05164d','LH'], KLM:['#00a1de','KL'], RYR:['#073590','FR'], EZY:['#ff6600','U2'], UAE:['#d71921','EK'],
  IBE:['#d7192d','IB'], VLG:['#ffcc00','VY','#222222'], TVF:['#00b140','HV'], SWR:['#e60000','LX'], SAS:['#000b6b','SK'], TAP:['#00a651','TP'],
  FDX:['#4d148c','FX'], UPS:['#5a3a22','5X'], QTR:['#5c0632','QR'], THY:['#c8102e','TK'], ETD:['#bd8b13','EY'], AZA:['#0b3a74','AZ'], AUA:['#d7141a','OS'],
  BEL:['#00a9e0','SN'], FIN:['#0b1560','AY'], EIN:['#00a68e','EI'], NAX:['#d81939','DY'], WZZ:['#c6007e','W6'], ELY:['#0b3a7a','LY'], SIA:['#f99f1c','SQ','#222222'],
  CPA:['#00655b','CX'], ANA:['#1b3b8a','NH'], JAL:['#cc0000','JL'], KAL:['#00256c','KE'], QFA:['#e0001b','QF'], OCN:['#5b2a86','4Y'], EWG:['#a6004a','EW'], CFG:['#f2a900','DE','#222222'], TOM:['#d40e14','BY'], EXS:['#e8212b','LS'], BCS:['#d40511','QY'], GEC:['#05164d','LH'], CLX:['#e2001a','CV'], MSR:['#0b3a74','MS'], RAM:['#c1272d','AT'], DAH:['#d71920','AH'], TAR:['#d71920','TU'], AEE:['#0d5eaf','A3'], LOT:['#11397e','LO'], CSA:['#d7141a','OK'], BTI:['#9bc53d','BT','#222222'], HOP:['#002157','A5'], AEA:['#0d5eaf','UX'], VOE:['#ff5a00','V7'], EZS:['#ff6600','DS'], TRA:['#00b140','HV'], SXS:['#f7931e','XQ','#222222'], PGT:['#ffd400','PC','#222222'], EJU:['#ff6600','EC'] };


/* Vrais logos : chargés via le relais (/logo/XX), convertis en 32x32 LEDs, mis en cache */
const logoCache = {};
function loadLogo(icao){
  const b = BRAND[icao]; if (!b || logoCache[icao]) return;
  logoCache[icao] = 'loading';
  const img = new Image(); img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = LS;
      const g = c.getContext('2d'); g.fillStyle = '#e9edf5'; g.fillRect(0,0,LS,LS);
      g.imageSmoothingQuality = 'high'; g.drawImage(img, 2, 2, LS-4, LS-4);
      const d = g.getImageData(0,0,LS,LS).data, a = new Uint8Array(LS*LS*3);
      for (let i=0;i<LS*LS;i++){ a[i*3]=d[i*4]; a[i*3+1]=d[i*4+1]; a[i*3+2]=d[i*4+2]; }
      logoCache[icao] = a; if (scene.logo === icao) paint();
    } catch(e){ logoCache[icao] = 'none'; }
  };
  img.onerror = () => { logoCache[icao] = 'none'; };
  img.src = cfg.proxy ? `${cfg.proxy}/logo/${b[1]}` : `https://images.kiwi.com/airlines/64x64/${b[1]}.png`;
}

const LX=4, LY=3, LS=32;                          // zone du logo (32 x 32 LEDs)
function drawLogo(icao){
  if (!icao){                                      // globe par défaut
    const bg=[28,79,214], fg=[159,192,255];
    rect(LX,LY,LS,LS,bg);
    for (let y=0;y<LS;y++) for (let x=0;x<LS;x++){
      const dx=x-15.5, dy=y-15.5, d=Math.hypot(dx,dy);
      const ring = Math.abs(d-14) < .75;
      const eq = d<14 && (Math.abs(dy)<.6 || Math.abs(Math.abs(dy)-7.5)<.6);
      const mer = d<14 && (Math.abs(dx)<.6 || Math.abs((dx/7)**2+(dy/14)**2-1)<.14);
      if (ring||eq||mer) put(LX+x,LY+y,fg);
    }
    return;
  }
  const cl = logoCache[icao];
  if (cl && cl !== 'loading' && cl !== 'none'){            // vrai logo chargé
    for (let y=0;y<LS;y++) for (let x=0;x<LS;x++){ const k=(y*LS+x)*3; put(LX+x,LY+y,[cl[k],cl[k+1],cl[k+2]]); }
    return;
  }
  loadLogo(icao);                                          // sinon : pastille en attendant / en secours
  let b = BRAND[icao], bg, code, fg=WHITE;
  if (b){ bg=hex(b[0]); code=b[1]; if (b[2]) fg=hex(b[2]); }
  else { let h=0; for(const c of icao) h=(h*31+c.charCodeAt(0))%360; bg=hsl(h,65,38); code=icao.slice(0,3); }
  rect(LX,LY,LS,LS,bg);
  const sc = code.length<=2 ? 2 : 1, w = textW(code,sc), h = 7*sc;
  text(code, LX+Math.round((LS-w)/2), LY+Math.round((LS-h)/2), fg, sc);
}

/* ---- Contenu affiché ---- */
const scene = { logo:'', l1:'', l2:'', l3:'', l4:'', l5l:'', l5r:'', l6:'', bar:0 };
const TX = 40, TR = 124, XL = 4, XR = 124;        // colonnes de texte
function compose(){
  fb.fill(0);
  drawLogo(scene.logo);
  text(fit(scene.l1,14), TX, 3);
  text(fit(scene.l2,14), TX, 14);
  if (scene.bar>0) rect(TX, 24, Math.round((TR-TX)*Math.min(1,scene.bar)), 2, GREEN);
  text(fit(scene.l3,14), TX, 28);
  text(fit(scene.l4,20), XL, 39);
  text(fit(scene.l5l, scene.l5r ? 12 : 20), XL, 50);
  textR(fit(scene.l5r,9), XR, 50);
  text(fit(scene.l6,20), XL, 61);
}

/* ---- Rendu : chaque LED est un disque, taille entière en pixels écran = net ---- */
const cvs = $('led'), ctx = cvs.getContext('2d');
const lit = document.createElement('canvas');
function paint(){
  compose();
  const dpr = window.devicePixelRatio || 1;
  const p = Math.max(3, Math.floor(Math.min(innerWidth/W, innerHeight/H) * dpr));
  cvs.width = W*p; cvs.height = H*p;
  cvs.style.width = (W*p/dpr)+'px'; cvs.style.height = (H*p/dpr)+'px';
  lit.width = W*p; lit.height = H*p;
  const lc = lit.getContext('2d'), r = p*0.40;
  ctx.fillStyle = '#05060a'; ctx.fillRect(0,0,cvs.width,cvs.height);
  // LEDs éteintes
  ctx.fillStyle = '#10131a'; ctx.beginPath();
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){ const i=(y*W+x)*3; if (!(fb[i]|fb[i+1]|fb[i+2])){ ctx.moveTo((x+.5)*p+r,(y+.5)*p); ctx.arc((x+.5)*p,(y+.5)*p,r*.8,0,6.2832); } }
  ctx.fill();
  // LEDs allumées
  lc.clearRect(0,0,lit.width,lit.height);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=(y*W+x)*3; if (!(fb[i]|fb[i+1]|fb[i+2])) continue;
    lc.fillStyle = `rgb(${fb[i]},${fb[i+1]},${fb[i+2]})`;
    lc.beginPath(); lc.arc((x+.5)*p,(y+.5)*p,r,0,6.2832); lc.fill();
  }
  if ('filter' in ctx){ ctx.filter = `blur(${p*0.55}px)`; ctx.globalAlpha = .55; ctx.drawImage(lit,0,0); ctx.filter='none'; ctx.globalAlpha = 1; }
  ctx.drawImage(lit,0,0);
}
addEventListener('resize', paint);

/* ============ Données de vol ============ */
const DEFAULTS = { radius:30, refresh:10, lat:48.8566, lon:2.3522, proxy:'https://radar-relay.sebnoel.workers.dev', follow:'', radarInfo1:'route', radarInfo2:'vrate', scaleDir:45 };
let cfg = Object.assign({}, DEFAULTS);
try { Object.assign(cfg, JSON.parse(localStorage.getItem('fd-cfg') || '{}')); } catch(e){}
cfg.radius = Math.min(200, Math.max(1, +cfg.radius || 30));
if (!cfg.proxy) cfg.proxy = DEFAULTS.proxy;
const INFO_KEYS = ['alt','route','speed','type','dist','track','vrate','none'];
if (!INFO_KEYS.includes(cfg.radarInfo1)) cfg.radarInfo1 = DEFAULTS.radarInfo1;
if (!INFO_KEYS.includes(cfg.radarInfo2)) cfg.radarInfo2 = DEFAULTS.radarInfo2;
cfg.scaleDir = +cfg.scaleDir; if (!(cfg.scaleDir >= 0 && cfg.scaleDir < 360 && cfg.scaleDir % 45 === 0)) cfg.scaleDir = DEFAULTS.scaleDir;
delete cfg.radarInfo;   // ancien réglage à une seule info

const AIRLINES = { UAL:'United', AAL:'American', DAL:'Delta', SWA:'Southwest', JBU:'JetBlue', ACA:'Air Canada', AFR:'Air France', BAW:'British Air', DLH:'Lufthansa', KLM:'KLM', RYR:'Ryanair', EZY:'easyJet', UAE:'Emirates', IBE:'Iberia', VLG:'Vueling', TVF:'Transavia', SWR:'Swiss', SAS:'SAS', TAP:'TAP Portugal', FDX:'FedEx', UPS:'UPS', QTR:'Qatar', THY:'Turkish', ETD:'Etihad', AZA:'ITA Airways', AUA:'Austrian', BEL:'Brussels', FIN:'Finnair', EIN:'Aer Lingus', NAX:'Norwegian', WZZ:'Wizz Air', ELY:'El Al', SIA:'Singapore', CPA:'Cathay', ANA:'ANA', JAL:'JAL', KAL:'Korean Air', QFA:'Qantas', OCN:'Discover', EWG:'Eurowings', CFG:'Condor', TOM:'TUI', TUI:'TUI', EXS:'Jet2', BCS:'DHL (EAT)', GEC:'Lufthansa Cargo', CLX:'Cargolux', MSR:'EgyptAir', RAM:'Royal Air Maroc', DAH:'Air Algerie', TAR:'Tunisair', AEE:'Aegean', LOT:'LOT Polish', CSA:'Czech Airlines', BTI:'airBaltic', HOP:'Air France Hop', AEA:'Air Europa', VOE:'Volotea', EZS:'easyJet CH', TRA:'Transavia', SXS:'SunExpress', PGT:'Pegasus', EJU:'easyJet' };
const TYPES = { B737:'Boeing 737', B738:'Boeing 737-800', B739:'Boeing 737-900', B38M:'Boeing 737 MAX 8', B752:'Boeing 757-200', B763:'Boeing 767-300', B772:'Boeing 777-200', B77W:'Boeing 777-300ER', B788:'Boeing 787-8', B789:'Boeing 787-9', B744:'Boeing 747-400', A318:'Airbus A318', A319:'Airbus A319', A320:'Airbus A320', A321:'Airbus A321', A20N:'Airbus A320neo', A21N:'Airbus A321neo', A332:'Airbus A330-200', A333:'Airbus A330-300', A359:'Airbus A350-900', A388:'Airbus A380', E170:'Embraer 170', E190:'Embraer 190', E195:'Embraer 195', CRJ9:'CRJ-900', AT76:'ATR 72-600', DH8D:'Dash 8 Q400' };
const routeCache = {};
let planes = [], idx = 0, timer = null, rotTimer = null, lastSource = '';

function status(m){ $('status').textContent = m; }
function show(o){ Object.assign(scene, { logo:'', l1:'', l2:'', l3:'', l4:'', l5l:'', l5r:'', l6:'', bar:0 }, o); paint(); }

function km(lat1,lon1,lat2,lon2){
  const R=6371, r=Math.PI/180, dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
const hhmm = d => d.toTimeString().slice(0,5);
async function getJSON(url, opt){ const r = await fetch(url, opt); if(!r.ok) throw new Error(r.status); return r.json(); }

async function fetchPlanes(){
  if (new URLSearchParams(location.search).has('demo')) return demoPlanes();
  const nm = Math.min(250, Math.max(1, cfg.radius/1.852)).toFixed(1);
  const errs = [];
  const base = cfg.proxy || 'https://api.adsb.lol';
  const sources = [
    ['adsb.lol',      `${base}/v2/point/${cfg.lat}/${cfg.lon}/${nm}`],
    ['airplanes.live',`https://api.airplanes.live/v2/point/${cfg.lat}/${cfg.lon}/${nm}`]
  ];
  for (const [name,u] of sources){
    try { const j = await getJSON(u); lastSource = name; return j.ac || j.aircraft || []; }
    catch(e){ errs.push(name+': '+e.message); }
  }
  try {
    const dLat = cfg.radius/111, dLon = cfg.radius/(111*Math.cos(cfg.lat*Math.PI/180));
    const u = `https://opensky-network.org/api/states/all?lamin=${cfg.lat-dLat}&lamax=${cfg.lat+dLat}&lomin=${cfg.lon-dLon}&lomax=${cfg.lon+dLon}`;
    const j = await getJSON(u); lastSource = 'opensky';
    return (j.states||[]).filter(x=>!x[8]).map(x=>({ flight:(x[1]||'').trim(), hex:x[0], lon:x[5], lat:x[6],
      alt_baro: x[7]!=null ? x[7]*3.281 : null, gs: x[9]!=null ? x[9]*1.944 : 0, track: x[10] ?? 0, t:'' }));
  } catch(e){ errs.push('opensky: '+e.message); }
  throw new Error(errs.join(' | '));
}

function demoPlanes(){
  lastSource = 'demo';
  const t = Date.now()/1000, r = cfg.radius;
  return [
    { flight:'UAL2186', hex:'demo1', track:((Math.atan2(-Math.sin(t/60)*0.0026, Math.cos(t/60)*0.0045)*180/Math.PI)+360)%360, t:'B737', lat:cfg.lat+(r*0.0045)*Math.sin(t/60), lon:cfg.lon+(r*0.004)*Math.cos(t/60), alt_baro:34000, gs:440 },
    { flight:'AFR1234', hex:'demo2', track:90, t:'A320', lat:cfg.lat-(r*0.003), lon:cfg.lon+(r*0.002), alt_baro:12500, gs:310 }
  ];
}

const routeTry = {};
async function fetchRoute(p){
  const cs = (p.flight||'').trim();
  if (!cs || routeCache[cs] || (routeTry[cs] && Date.now()-routeTry[cs] < 120000)) return;   // nouvel essai après 2 min
  routeTry[cs] = Date.now();
  const base = cfg.proxy || 'https://api.adsb.lol';
  const num = v => typeof v === 'number' && isFinite(v);
  let code = null, ap = null;                      // ap = [{lat,lon}, ...] du départ à l'arrivée
  try {                                            // 1) adsb.lol : GET /api/0/route/{indicatif}/{lat}/{lon}
    let j = await getJSON(`${base}/api/0/route/${encodeURIComponent(cs)}/${p.lat}/${p.lon}`);
    if (Array.isArray(j)) j = j[0];
    if (j && j.plausible !== false && j.plausible !== 0){
      const list = j._airports || [];
      code = j._airport_codes_iata || list.map(a=>a.iata).filter(Boolean).join('-') || null;
      ap = list.filter(a => a && num(a.lat) && num(a.lon));
    }
  } catch(e){}
  if ((!code || code==='unknown' || !ap || ap.length < 2) && cfg.proxy){     // 2) secours / compléments : adsbdb
    try {
      const j = await getJSON(`${cfg.proxy}/adsbdb/v0/callsign/${encodeURIComponent(cs)}`);
      const f = j?.response?.flightroute;
      if (f?.origin?.iata_code && f?.destination?.iata_code){
        const code2 = f.origin.iata_code + '-' + f.destination.iata_code;
        const ap2 = (num(f.origin.latitude) && num(f.destination.latitude))
          ? [{lat:f.origin.latitude, lon:f.origin.longitude}, {lat:f.destination.latitude, lon:f.destination.longitude}] : null;
        if (!code || code==='unknown'){ code = code2; ap = ap2; }
        else if ((!ap || ap.length < 2) && code === code2) ap = ap2;
      }
    } catch(e){}
  }
  if (code && code !== 'unknown' && code.includes('-')){
    const parts = code.split('-'), ok = ap && ap.length >= 2;
    routeCache[cs] = { text: `${parts[0]} -> ${parts[parts.length-1]}`,
                       orig: ok ? {lat:ap[0].lat, lon:ap[0].lon} : null,
                       dest: ok ? {lat:ap[ap.length-1].lat, lon:ap[ap.length-1].lon} : null };
    render();
  }
}

function showError(m){
  const e = String(m).replace(/Failed to fetch/g,'blocked').split(' | ');
  show({ l1:'Network', l2:'Error', l4:'API unreachable', l5l:e[0]||'', l6:e[1]||'' });
}

/* ---- Suivi d'un vol ---- */
let followMode = 'auto';           // auto : épinglé tant qu'il vole | normal : affichage normal forcé | follow : ce vol forcé
let followPlane = null, followAirborne = false, followSeenAir = false, followLastSeen = 0, followLow = false;

const pinned = () => !!cfg.follow && (followMode === 'follow' || (followMode === 'auto' && followAirborne));

function saveCfg(){ try { localStorage.setItem('fd-cfg', JSON.stringify(cfg)); } catch(e){} }
function resetFollow(){ followMode='auto'; followPlane=null; followAirborne=false; followSeenAir=false; followLastSeen=0; followLow=false; }

function landed(){                                   // vol posé : on oublie le suivi, retour à l'affichage normal
  cfg.follow = ''; saveCfg(); resetFollow(); render();
}

async function fetchFollow(){
  const cs = cfg.follow; if (!cs) return;
  let ac = null;
  try {
    const j = await getJSON(`${cfg.proxy || 'https://api.adsb.lol'}/v2/callsign/${encodeURIComponent(cs)}`);
    ac = (j.ac || j.aircraft || []).find(a => typeof a.lat === 'number' && typeof a.lon === 'number') || null;
  } catch(e){ return; }                               // erreur réseau : on garde l'état précédent
  if (ac){
    ac._d = km(cfg.lat, cfg.lon, ac.lat, ac.lon);
    const onGround = ac.alt_baro === 'ground' || (typeof ac.alt_baro === 'number' && ac.alt_baro < 100 && (ac.gs||0) < 60);
    followPlane = ac; followLastSeen = Date.now();
    followAirborne = !onGround;
    followLow = typeof ac.alt_baro === 'number' && ac.alt_baro < 4000;
    if (!onGround) followSeenAir = true;
    if (followSeenAir && onGround) { landed(); return; }
    fetchRoute(ac);
  } else {
    followPlane = null; followAirborne = false;
    const gone = Date.now() - followLastSeen;
    if (followSeenAir && ((followLow && gone > 180000) || gone > 600000)) landed();   // disparu : près du sol 3 min, sinon 10 min
  }
}

function updateButtons(){
  $('dock').style.display = cfg.follow ? 'flex' : 'none';
  if (!cfg.follow) return;
  $('bFollow').textContent = cfg.follow;
  const pin = pinned();
  $('bFollow').classList.toggle('on', pin);
  $('bNormal').classList.toggle('on', !pin);
}
$('bNormal').onclick = () => { followMode = 'normal'; render(); };
$('bFollow').onclick = () => { followMode = 'follow'; render(); };

function showPlane(p){
  const cs = (p.flight||p.hex||'').trim();
  const icao = /^[A-Z]{3}\d/.test(cs) ? cs.slice(0,3) : '';
  const airline = AIRLINES[icao] || (p.ownOp || 'Flight');
  const type = TYPES[p.t] || p.desc || p.t || 'Unknown type';
  const gs = p.gs || 0, rt = routeCache[cs];
  const fmt = v => v >= 100 ? String(Math.round(v)) : v.toFixed(1);

  // Altitude : niveau de vol au-dessus de 18 000 ft
  let alt = 'ground';
  if (typeof p.alt_baro === 'number') alt = p.alt_baro >= 18000 ? 'FL' + String(Math.round(p.alt_baro/100)).padStart(3,'0') : Math.round(p.alt_baro/100)*100 + 'ft';
  const altTxt = (alt.length <= 6 ? 'Alt ' : '') + alt;

  // Avec la route connue : distance restante, ETA et progression vers l'aéroport d'arrivée
  let eta = '--:--', toGo = `${fmt(p._d)}km away`, bar = Math.max(0.03, 1 - p._d/cfg.radius);
  if (rt && rt.dest){
    const rem = km(p.lat, p.lon, rt.dest.lat, rt.dest.lon);
    toGo = `${fmt(rem)}km to go`;
    if (gs > 30) eta = hhmm(new Date(Date.now() + rem/(gs*1.852)*3600000));
    if (rt.orig){ const tot = km(rt.orig.lat, rt.orig.lon, rt.dest.lat, rt.dest.lon); if (tot > 20) bar = Math.min(1, Math.max(0.03, 1 - rem/tot)); }
  }
  show({ logo:icao, l1:airline, l2:cs, l3:rt?.text || '---', l4:type,
         l5l:altTxt, l5r:`ETA ${eta}`, l6:toGo, bar });
}

function render(){
  updateButtons();
  if (pinned()){
    if (followPlane) showPlane(followPlane);
    else if (followSeenAir) show({ l1:'Following', l2:cfg.follow, l4:'Signal lost', l5l:`Last seen ${hhmm(new Date(followLastSeen))}`, l6: followLow ? 'Probably landed' : '' });
    else show({ l1:'Following', l2:cfg.follow, l4:'Searching...', l5l:'Not in the air yet' });
    return;
  }
  if (pickedHex && Date.now() < pickedUntil){                 // avion choisi sur le radar (2 min)
    const q = planes.find(a => a.hex === pickedHex);
    if (q){ showPlane(q); return; }
  }
  if(!planes.length){
    show({ l1:'Radar', l2:'No aircraft', l4:`Radius ${cfg.radius}km`, l5l:`Src ${lastSource}`, l6:`Every ${cfg.refresh}s` });
    return;
  }
  showPlane(planes[idx % planes.length]);
}

async function tick(){
  if (cfg.follow) await fetchFollow();
  try {
    const ac = await fetchPlanes();
    planes = ac.filter(a => typeof a.lat==='number' && typeof a.lon==='number')
               .map(a => Object.assign(a, { _d: km(cfg.lat,cfg.lon,a.lat,a.lon), _t: Date.now() }))
               .filter(a => a._d <= cfg.radius)
               .sort((a,b) => a._d - b._d);
    planes.slice(0, (cfg.radarInfo1 === 'route' || cfg.radarInfo2 === 'route') ? 12 : 3).forEach(fetchRoute);
    status(`${planes.length} avion(s) • source ${lastSource} • ${hhmm(new Date())}`);
  } catch(e){
    planes = []; status('Erreur réseau : ' + e.message); console.error(e);
    if (pinned()) render(); else { updateButtons(); showError(e.message); }
    return;
  }
  render();
}

function start(){
  clearInterval(timer); clearInterval(rotTimer);
  tick();
  timer = setInterval(tick, Math.max(2, cfg.refresh)*1000);
  rotTimer = setInterval(()=>{ idx++; render(); }, 8000);
}

/* Paramètres */
function openSettings(){ $('radius').value=cfg.radius; $('refresh').value=cfg.refresh; $('lat').value=cfg.lat; $('lon').value=cfg.lon; $('proxy').value=cfg.proxy||''; $('follow').value=cfg.follow||''; $('radarInfo1').value=cfg.radarInfo1; $('radarInfo2').value=cfg.radarInfo2; $('scaleDir').value=String(cfg.scaleDir); $('settings').classList.add('open'); }
$('gear').onclick = openSettings;
$('close').onclick = () => $('settings').classList.remove('open');
$('save').onclick = () => {
  cfg = { radius:Math.min(200, Math.max(1, +$('radius').value||DEFAULTS.radius)), refresh:+$('refresh').value||DEFAULTS.refresh, lat:+$('lat').value, lon:+$('lon').value, proxy:$('proxy').value.trim().replace(/\/$/,''), follow:$('follow').value.trim().toUpperCase().replace(/\s+/g,''), radarInfo1:$('radarInfo1').value, radarInfo2:$('radarInfo2').value, scaleDir:+$('scaleDir').value };
  saveCfg(); resetFollow();
  $('settings').classList.remove('open'); idx=0; start();
};
$('geo').onclick = () => {
  if (!navigator.geolocation) return status('Géolocalisation non disponible sur cet appareil');
  status('Recherche de la position…');
  navigator.geolocation.getCurrentPosition(
    pos => { $('lat').value = pos.coords.latitude.toFixed(4); $('lon').value = pos.coords.longitude.toFixed(4); status('Position trouvée : pensez à Enregistrer'); },
    err => status(err.code === 1 ? 'Position refusée : autorisez-la pour ce site dans les réglages de l’appareil'
                : err.code === 2 ? 'Position indisponible (service de localisation désactivé ?)'
                : 'Délai dépassé, réessayez'),
    { enableHighAccuracy:false, timeout:15000, maximumAge:600000 }
  );
};

/* Plein écran : double-clic / double-toucher sur l'écran, ou touche F */
function toggleFS(){
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else { (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); }
}
let clickT = null;                                              // clic = vue radar, double-clic = plein écran
cvs.addEventListener('click', () => { clearTimeout(clickT); clickT = setTimeout(showRadar, 280); });
cvs.addEventListener('dblclick', () => { clearTimeout(clickT); toggleFS(); });
addEventListener('keydown', e => { if (e.key === 'Escape') hideRadar(); });
addEventListener('keydown', e => { if ((e.key==='f' || e.key==='F') && !/INPUT/.test(document.activeElement.tagName)) toggleFS(); });

/* ============ Vue radar ============ */
const rcv = $('radar'), rctx = rcv.getContext('2d');
let view = 'led', radarHits = [], pickedHex = '', pickedUntil = 0;
function sizeRadar(){ const d = window.devicePixelRatio || 1; rcv.width = Math.round(innerWidth*d); rcv.height = Math.round(innerHeight*d); }
function showRadar(){ view = 'radar'; rcv.style.display = 'block'; sizeRadar(); requestAnimationFrame(radarLoop); }
function hideRadar(){ view = 'led'; rcv.style.display = 'none'; }
addEventListener('resize', () => { if (view === 'radar') sizeRadar(); });
function radarLoop(t){ if (view !== 'radar') return; drawRadar(t); requestAnimationFrame(radarLoop); }

const PLANE = [[0,-1],[.12,-.55],[.95,.05],[.95,.22],[.12,0],[.1,.65],[.4,.85],[.4,.98],[0,.88],[-.4,.98],[-.4,.85],[-.1,.65],[-.12,0],[-.95,.22],[-.95,.05],[-.12,-.55]];
const GL = '90,255,130';

function radarInfoText(p, cs, distKm, kind){
  switch (kind){
    case 'route': return routeCache[cs]?.text.replace(' -> ', ' → ') || '---';
    case 'speed': return p.gs ? Math.round(p.gs) + ' kt' : '-- kt';
    case 'type':  return p.t || '--';
    case 'dist':  return (distKm >= 100 ? Math.round(distKm) : distKm.toFixed(1)) + ' km';
    case 'track': return typeof p.track === 'number' ? Math.round(p.track) + '°' : '--';
    case 'vrate': { const r = p.baro_rate; if (typeof r !== 'number') return '--'; return Math.abs(r) < 200 ? '→ level' : (r > 0 ? '↑ ' : '↓ ') + Math.abs(Math.round(r/100)*100) + ' ft/min'; }
    case 'none':  return '';
    default:      return typeof p.alt_baro === 'number' ? 'FL' + String(Math.round(p.alt_baro/100)).padStart(3,'0') : 'GND';
  }
}

function drawRadar(t){
  const c = rctx, d = window.devicePixelRatio || 1, W = rcv.width, H = rcv.height;
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle = '#010805'; c.fillRect(0,0,W,H);
  const cx = W/2, cy = H/2, R = Math.min(W,H)/2 - 16*d;
  const mono = px => `600 ${px}px ui-monospace, Menlo, Consolas, monospace`;

  // fond vert du disque
  const g = c.createRadialGradient(cx,cy,0,cx,cy,R); g.addColorStop(0,'#0d4a20'); g.addColorStop(1,'#04200d');
  c.fillStyle = g; c.beginPath(); c.arc(cx,cy,R,0,6.2832); c.fill();

  // balayage
  if (c.createConicGradient){
    const a = (t/4500 % 1) * 6.2832, cg = c.createConicGradient(a, cx, cy);
    cg.addColorStop(0, `rgba(${GL},0)`); cg.addColorStop(.88, `rgba(${GL},0)`); cg.addColorStop(1, `rgba(${GL},.38)`);
    c.fillStyle = cg; c.beginPath(); c.arc(cx,cy,R,0,6.2832); c.fill();
  }

  // cercles de distance + axes
  c.strokeStyle = `rgba(${GL},.6)`; c.lineWidth = 1.5*d;
  for (let k=1;k<=4;k++){ c.beginPath(); c.arc(cx,cy,R*k/4,0,6.2832); c.stroke(); }
  c.beginPath(); c.moveTo(cx-R,cy); c.lineTo(cx+R,cy); c.moveTo(cx,cy-R); c.lineTo(cx,cy+R); c.stroke();
  const lf = Math.max(10*d, R*0.03); c.font = mono(lf); c.fillStyle = `rgba(${GL},.85)`; c.textBaseline = 'middle';
  const sa = cfg.scaleDir * Math.PI/180, sdx = Math.round(Math.sin(sa)*1000)/1000, sdy = -Math.round(Math.cos(sa)*1000)/1000;
  for (let k=1;k<=4;k++){ const v = cfg.radius*k/4, r = R*k/4;
    let tx = cx + r*sdx, ty = cy + r*sdy;
    if (sdx > 0.1){ c.textAlign = 'left'; tx += 4*d; } else if (sdx < -0.1){ c.textAlign = 'right'; tx -= 4*d; } else { c.textAlign = 'left'; tx += lf*1.2; }
    if (sdy === 0) ty -= lf*0.8;                                    // sur l'axe E/O : texte au-dessus du trait
    c.fillText((v >= 10 ? Math.round(v) : v.toFixed(1)) + ' km', tx, ty); }
  c.textAlign = 'left';
  c.textAlign = 'center'; c.fillText('N', cx, cy - R - 0*d + lf*0.1 + 0); c.textAlign = 'left';

  // moi, au centre
  c.fillStyle = '#f4ffd0'; c.shadowColor = '#d6ff3a'; c.shadowBlur = 12*d;
  c.beginPath(); c.arc(cx,cy,5*d,0,6.2832); c.fill(); c.shadowBlur = 0;

  // avions
  const kmx = 111.32*Math.cos(cfg.lat*Math.PI/180), kmy = 110.57, now = Date.now();
  const s = Math.max(8*d, R*0.035), fs = Math.max(11*d, Math.min(18*d, R*0.04));
  radarHits = [];
  for (const p of planes){
    let x = (p.lon-cfg.lon)*kmx, y = (p.lat-cfg.lat)*kmy;
    const tr = (p.track || 0) * Math.PI/180, v = (p.gs||0)*1.852/3600 * Math.min(30, (now-(p._t||now))/1000);
    x += Math.sin(tr)*v; y += Math.cos(tr)*v;                       // extrapolation entre deux relevés
    const px = cx + x/cfg.radius*R, py = cy - y/cfg.radius*R;
    if (Math.hypot(px-cx,py-cy) > R + s) continue;

    c.save(); c.translate(px,py); c.rotate(tr);                     // icône orientée selon le cap réel
    c.fillStyle = '#d6ff3a'; c.shadowColor = '#d6ff3a'; c.shadowBlur = 10*d;
    c.beginPath(); PLANE.forEach(([a,b],i) => i ? c.lineTo(a*s,b*s) : c.moveTo(a*s,b*s)); c.closePath(); c.fill();
    c.restore(); c.shadowBlur = 0;

    const cs = (p.flight || p.hex || '?').trim(), dk = Math.hypot(x,y), infos = [radarInfoText(p, cs, dk, cfg.radarInfo1), radarInfoText(p, cs, dk, cfg.radarInfo2)].filter(Boolean);
    const followed = cfg.follow && cs === cfg.follow;
    c.font = mono(fs); c.fillStyle = followed ? '#ffffff' : '#e8ffe0';
    c.shadowColor = '#000'; c.shadowBlur = 4*d;
    const lx = px + s*1.4, ly = py - fs*0.15; c.fillText(cs, lx, ly);
    if (infos.length){ c.font = mono(fs*0.75); c.fillStyle = `rgba(${GL},.95)`; infos.forEach((t,i) => c.fillText(t, lx, ly + fs*(0.95 + i*0.85))); } c.shadowBlur = 0;
    c.font = mono(fs);
    radarHits.push({ hex:p.hex, x:px, y:py, r:Math.max(30*d, s*2.5), lx, ly:ly-fs*0.6, lw:c.measureText(cs).width, lh:fs*(1.1 + infos.length*0.85) });
  }

  c.font = mono(Math.max(11*d, R*0.028)); c.fillStyle = `rgba(${GL},.7)`; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillText(`${planes.length} aircraft · ${cfg.radius} km`, 14*d, 14*d);
  c.textBaseline = 'alphabetic';
}

rcv.addEventListener('click', e => {                              // clic sur un avion : retour à l'écran, centré sur lui
  const d = window.devicePixelRatio || 1, x = e.offsetX*d, y = e.offsetY*d;
  let best = null, bd = 1e9;
  for (const h of radarHits){
    const inLabel = x >= h.lx && x <= h.lx+h.lw && y >= h.ly && y <= h.ly+h.lh;
    const dd = inLabel ? 0 : Math.hypot(x-h.x, y-h.y);
    if (dd < h.r && dd < bd){ best = h; bd = dd; }
  }
  hideRadar();
  if (best){
    pickedHex = best.hex; pickedUntil = Date.now() + 120000;
    if (pinned()) followMode = 'normal';
    const q = planes.find(a => a.hex === best.hex); if (q) fetchRoute(q);
    render();
  }
});

/* Curseur de souris : masqué après 3 s sans mouvement */
let idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!$('settings').classList.contains('open')) document.body.classList.add('idle'); }, 3000); }
['mousemove','mousedown','touchstart','keydown'].forEach(ev => addEventListener(ev, wake, { passive:true }));
wake();

/* Écran toujours allumé (si supporté) */
async function keepAwake(){ try { await navigator.wakeLock?.request('screen'); } catch(e){} }
keepAwake(); document.addEventListener('visibilitychange', () => document.visibilityState==='visible' && keepAwake());

show({ l1:'Radar', l2:'Scanning', l4:'Waiting for data' });
start();
</script>
</body>
